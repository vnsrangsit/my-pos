<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>รายการสต็อครองเท้า</title>
<style>
  :root{
    --pink:#ff6fa5;
    --pink-dark:#e6528c;
    --bg:#fff6f9;
    --card:#ffffff;
    --border:#f0d9e4;
    --text:#3a2a32;
    --muted:#9b8790;
    --green:#3fae5c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', Tahoma, sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  header{
    background:linear-gradient(135deg,#ff8fb8,#ff6fa5);
    color:#fff;
    padding:20px 16px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
    position:sticky;
    top:0;
    z-index:10;
  }
  header h1{margin:0 0 4px;font-size:1.4rem;}
  header p{margin:0;font-size:0.85rem;opacity:0.9;}
  .toolbar{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
    padding:14px 16px;
    background:#fff;
    border-bottom:1px solid var(--border);
    position:sticky;
    top:78px;
    z-index:9;
  }
  .toolbar input[type="text"]{
    padding:8px 12px;
    border-radius:20px;
    border:1px solid var(--border);
    width:220px;
    max-width:60vw;
    font-size:0.9rem;
  }
  .toolbar button{
    padding:8px 16px;
    border-radius:20px;
    border:none;
    background:var(--pink);
    color:#fff;
    font-size:0.85rem;
    cursor:pointer;
  }
  .toolbar button.secondary{
    background:#fff;
    color:var(--pink-dark);
    border:1px solid var(--pink);
  }
  .toolbar .summary{
    font-size:0.85rem;
    color:var(--muted);
    align-self:center;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(210px, 1fr));
    gap:16px;
    padding:18px;
    max-width:1400px;
    margin:0 auto;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 2px 6px rgba(0,0,0,0.05);
    display:flex;
    flex-direction:column;
  }
  .card img{
    width:100%;
    height:170px;
    object-fit:cover;
    background:#eee;
    cursor:zoom-in;
  }
  .card .body{
    padding:10px 12px 14px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .code{
    font-weight:700;
    font-size:1rem;
    color:var(--pink-dark);
    text-align:center;
  }
  .field-label{
    font-size:0.75rem;
    color:var(--muted);
    margin-bottom:2px;
  }
  .size-pills{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    justify-content:center;
  }
  .pill{
    position:relative;
    width:34px;
    height:34px;
    border-radius:50%;
    border:1px solid var(--border);
    background:#fff;
    color:var(--text);
    font-size:0.85rem;
    cursor:pointer;
  }
  .pill.active{
    border-color:var(--pink);
    background:#fff0f6;
    color:var(--pink-dark);
  }
  .pill.has-stock::after{
    content:"";
    position:absolute;
    top:-2px;
    right:-2px;
    width:9px;
    height:9px;
    border-radius:50%;
    background:var(--green);
    border:1.5px solid #fff;
  }
  .size-panel{
    display:none;
    align-items:center;
    justify-content:center;
    gap:8px;
    background:#fdf1f6;
    border:1px solid var(--border);
    border-radius:8px;
    padding:6px 8px;
  }
  .size-panel.open{ display:flex; }
  .size-panel .panel-label{
    font-size:0.85rem;
    font-weight:600;
    color:var(--pink-dark);
    white-space:nowrap;
  }
  .size-panel input[type="number"]{
    width:70px;
    padding:5px 6px;
    border-radius:6px;
    border:1px solid var(--border);
    font-size:0.9rem;
    text-align:center;
  }
  .panels-wrap{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  footer{
    text-align:center;
    padding:24px;
    color:var(--muted);
    font-size:0.8rem;
  }
  .lightbox{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.8);
    align-items:center;
    justify-content:center;
    z-index:100;
    cursor:zoom-out;
  }
  .lightbox img{
    max-width:90vw;
    max-height:90vh;
    border-radius:8px;
  }
  .lightbox.open{display:flex;}
</style>
</head>
<body>

<header>
  <h1>รายการสต็อครองเท้า</h1>
  <p>กดเบอร์ที่ต้องการ (25-35) แล้วกรอกจำนวนสต็อค — จุดเขียวแปลว่ามีสต็อคแล้ว</p>
</header>

<div class="toolbar">
  <input type="text" id="searchBox" placeholder="ค้นหารหัสรุ่น...">
  <button id="exportBtn">ดาวน์โหลด CSV</button>
  <button class="secondary" id="resetBtn">ล้างข้อมูลทั้งหมด</button>
  <span class="summary" id="summary"></span>
</div>

<div class="grid" id="grid"></div>

<div class="lightbox" id="lightbox"><img id="lightboxImg" src=""></div>

<footer>ทำโดย Claude · ข้อมูลเก็บไว้ในเบราว์เซอร์เครื่องนี้เท่านั้น</footer>

<script>
const codes = [
  "41A16B1","41A18B1","41A19B1","41C12B1","41C18B1","41C20B1",
  "41G94C1","41G97C1","41G99B1","41N08-C1","41N09C1","41N18B1","41N19C1",
  "CD-11","CD-22","CD-88","CD-99","CF-2564","CF-2566","CK-2",
  "PC-2218","PC-2219","PN-885","PN-995","SF-222","SM-4","SP-2","SP-6529","SP-6530"
];

// fixed size range every model can have
const SIZES = [];
for(let s=25; s<=35; s++) SIZES.push(s);

const STORAGE_KEY = "shoeStockData_v3";

function loadData(){
  try{
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
  }catch(e){ return {}; }
}
function saveData(data){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

let data = loadData();
codes.forEach(c=>{
  // shape: { sizes: { "25": 0, "26": 0, ... "35": 0 } }
  if(!data[c] || typeof data[c] !== 'object' || !data[c].sizes){
    data[c] = { sizes: {} };
  }
  SIZES.forEach(sz=>{
    if(data[c].sizes[sz] === undefined) data[c].sizes[sz] = 0;
  });
});
saveData(data);

const grid = document.getElementById('grid');
const searchBox = document.getElementById('searchBox');
const summary = document.getElementById('summary');

function updateSummary(){
  let totalStock = 0;
  codes.forEach(c=>{
    SIZES.forEach(sz=> totalStock += (parseInt(data[c].sizes[sz])||0));
  });
  summary.textContent = `รวม ${codes.length} รุ่น · สต็อครวม ${totalStock} คู่`;
}

function render(filter=""){
  grid.innerHTML = "";
  const f = filter.trim().toLowerCase();
  codes.forEach(code=>{
    if(f && !code.toLowerCase().includes(f)) return;

    const card = document.createElement('div');
    card.className = 'card';

    const img = document.createElement('img');
    img.src = code + ".JPG";
    img.alt = code;
    img.loading = "lazy";
    img.onerror = function(){ this.src = ""; this.style.background="#f2e3ea"; this.alt="ไม่พบรูป"; };
    img.onclick = ()=>{
      document.getElementById('lightboxImg').src = img.src;
      document.getElementById('lightbox').classList.add('open');
    };
    card.appendChild(img);

    const body = document.createElement('div');
    body.className = 'body';

    const codeEl = document.createElement('div');
    codeEl.className = 'code';
    codeEl.textContent = code;
    body.appendChild(codeEl);

    const label = document.createElement('div');
    label.className = 'field-label';
    label.textContent = 'เบอร์ (กดเพื่อกรอกสต็อค)';
    body.appendChild(label);

    const pillRow = document.createElement('div');
    pillRow.className = 'size-pills';

    const panelsWrap = document.createElement('div');
    panelsWrap.className = 'panels-wrap';

    SIZES.forEach(sz=>{
      const pill = document.createElement('button');
      pill.type = 'button';
      pill.className = 'pill';
      pill.textContent = sz;
      if((parseInt(data[code].sizes[sz])||0) > 0) pill.classList.add('has-stock');

      const panel = document.createElement('div');
      panel.className = 'size-panel';

      const panelLabel = document.createElement('span');
      panelLabel.className = 'panel-label';
      panelLabel.textContent = 'เบอร์ ' + sz + ':';

      const stockInput = document.createElement('input');
      stockInput.type = 'number';
      stockInput.min = '0';
      stockInput.value = data[code].sizes[sz];
      stockInput.oninput = ()=>{
        const v = parseInt(stockInput.value)||0;
        data[code].sizes[sz] = v;
        saveData(data);
        pill.classList.toggle('has-stock', v > 0);
        updateSummary();
      };

      panel.appendChild(panelLabel);
      panel.appendChild(stockInput);

      pill.onclick = ()=>{
        const isOpen = panel.classList.toggle('open');
        pill.classList.toggle('active', isOpen);
        if(isOpen) stockInput.focus();
      };

      pillRow.appendChild(pill);
      panelsWrap.appendChild(panel);
    });

    body.appendChild(pillRow);
    body.appendChild(panelsWrap);

    card.appendChild(body);
    grid.appendChild(card);
  });
  updateSummary();
}

searchBox.oninput = ()=> render(searchBox.value);

document.getElementById('exportBtn').onclick = ()=>{
  let csv = "รหัสรุ่น,เบอร์,จำนวนสต็อค\n";
  codes.forEach(c=>{
    SIZES.forEach(sz=>{
      const v = parseInt(data[c].sizes[sz])||0;
      if(v > 0) csv += `${c},${sz},${v}\n`;
    });
  });
  const blob = new Blob(["﻿"+csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = "สต็อครองเท้า.csv";
  a.click();
  URL.revokeObjectURL(url);
};

document.getElementById('resetBtn').onclick = ()=>{
  if(confirm("ล้างข้อมูลสต็อคทั้งหมดใช่หรือไม่?")){
    codes.forEach(c=>{
      data[c] = { sizes: {} };
      SIZES.forEach(sz=> data[c].sizes[sz] = 0);
    });
    saveData(data);
    render(searchBox.value);
  }
};

document.getElementById('lightbox').onclick = function(){
  this.classList.remove('open');
};

render();
</script>
</body>
</html>
