<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>รายการสต็อครองเท้า</title>
<style>
  :root{
    --pink:#ff6fa5;
    --pink-dark:#e6528c;
    --bg:#fff6f9;
    --card:#ffffff;
    --border:#f0d9e4;
    --text:#3a2a32;
    --muted:#9b8790;
    --green:#3fae5c;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{ touch-action:manipulation; }
  body{
    margin:0;
    font-family:'Segoe UI', Tahoma, sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-text-size-adjust:100%;
    overscroll-behavior-y:contain;
  }
  header{
    background:linear-gradient(135deg,#ff8fb8,#ff6fa5);
    color:#fff;
    padding:16px 14px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
    position:sticky;
    top:0;
    z-index:10;
  }
  header h1{margin:0 0 4px;font-size:1.2rem;}
  header p{margin:0;font-size:0.78rem;opacity:0.9;}
  .toolbar{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    justify-content:center;
    padding:10px 12px;
    background:#fff;
    border-bottom:1px solid var(--border);
    position:sticky;
    top:70px;
    z-index:9;
  }
  .toolbar input[type="text"]{
    padding:9px 12px;
    border-radius:20px;
    border:1px solid var(--border);
    width:180px;
    max-width:55vw;
    font-size:16px;
  }
  .toolbar button{
    padding:9px 14px;
    border-radius:20px;
    border:none;
    background:var(--pink);
    color:#fff;
    font-size:0.8rem;
    cursor:pointer;
  }
  .toolbar button.secondary{
    background:#fff;
    color:var(--pink-dark);
    border:1px solid var(--pink);
  }
  .summary-bar{
    text-align:center;
    font-size:0.78rem;
    color:var(--muted);
    padding:6px 0 2px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));
    gap:12px;
    padding:12px;
    max-width:1400px;
    margin:0 auto;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 2px 6px rgba(0,0,0,0.05);
    display:flex;
    flex-direction:column;
  }
  .card img{
    width:100%;
    height:130px;
    object-fit:cover;
    background:#eee;
  }
  .card .body{
    padding:8px 8px 10px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .code{
    font-weight:700;
    font-size:0.85rem;
    color:var(--pink-dark);
    text-align:center;
  }
  .meta{
    font-size:0.65rem;
    color:var(--muted);
    text-align:center;
    line-height:1.3;
    margin-top:-4px;
  }
  .meta .brand{
    font-weight:600;
    color:#b96f8c;
  }
  .size-pills{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    justify-content:center;
  }
  .pill{
    position:relative;
    width:30px;
    height:30px;
    border-radius:50%;
    border:1px solid var(--border);
    background:#fff;
    color:var(--text);
    font-size:0.75rem;
    cursor:pointer;
    padding:0;
  }
  .pill.has-stock{
    border-color:var(--green);
    background:#eafbee;
    color:#2c8a45;
    font-weight:700;
  }
  .pill.has-stock::after{
    content:"";
    position:absolute;
    top:-2px;
    right:-2px;
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--green);
    border:1.5px solid #fff;
  }

  /* bottom sheet */
  .sheet-backdrop{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.45);
    z-index:200;
  }
  .sheet-backdrop.open{ display:block; }
  .sheet{
    position:fixed;
    left:0; right:0; bottom:0;
    background:#fff;
    border-radius:18px 18px 0 0;
    padding:10px 18px calc(14px + env(safe-area-inset-bottom));
    z-index:201;
    transform:translateY(100%);
    transition:transform 0.25s ease;
    box-shadow:0 -4px 20px rgba(0,0,0,0.15);
  }
  .sheet-backdrop.open .sheet{ transform:translateY(0); }
  .sheet .handle{
    width:36px;
    height:4px;
    border-radius:2px;
    background:var(--border);
    margin:0 auto 10px;
  }
  .sheet .sheet-title{
    text-align:center;
    font-size:1rem;
    font-weight:700;
    color:var(--pink-dark);
    margin-bottom:0;
  }
  .sheet .sheet-sub{
    text-align:center;
    font-size:0.75rem;
    color:var(--muted);
    margin-bottom:10px;
  }
  .sheet .stepper{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin-bottom:14px;
  }
  .sheet .stepper button{
    width:44px;
    height:44px;
    border-radius:50%;
    border:none;
    background:#fdeaf1;
    color:var(--pink-dark);
    font-size:1.4rem;
    line-height:1;
    cursor:pointer;
    flex-shrink:0;
  }
  .sheet .stepper button:active{ background:var(--pink); color:#fff; }
  .sheet .stepper input{
    width:70px;
    text-align:center;
    padding:8px 4px;
    border-radius:12px;
    border:1px solid var(--border);
    font-size:18px;
    font-weight:700;
    background:#faf6f8;
    caret-color:transparent;
  }
  .sheet .sheet-actions{
    display:flex;
    gap:8px;
  }
  .sheet .sheet-actions button{
    flex:1;
    padding:11px;
    border-radius:12px;
    border:none;
    font-size:0.9rem;
    font-weight:600;
    cursor:pointer;
  }
  .sheet .btn-save{
    background:var(--pink);
    color:#fff;
  }
  .sheet .btn-clear{
    background:#f4eef1;
    color:var(--muted);
  }

  footer{
    text-align:center;
    padding:20px;
    color:var(--muted);
    font-size:0.75rem;
  }
  .lightbox{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.8);
    align-items:center;
    justify-content:center;
    z-index:100;
    cursor:zoom-out;
  }
  .lightbox img{
    max-width:90vw;
    max-height:90vh;
    border-radius:8px;
  }
  .lightbox.open{display:flex;}
</style>
</head>
<body>

<header>
  <h1>รายการสต็อครองเท้า</h1>
  <p>แตะเบอร์ที่ต้องการเพื่อใส่จำนวนสต็อค</p>
</header>

<div class="toolbar">
  <input type="text" id="searchBox" placeholder="ค้นหารหัสรุ่น...">
  <button id="exportBtn">Export Shopee CSV</button>
  <button class="secondary" id="resetBtn">ล้างข้อมูล</button>
</div>
<div class="summary-bar" id="summary"></div>

<div class="grid" id="grid"></div>

<div class="lightbox" id="lightbox"><img id="lightboxImg" src=""></div>

<div class="sheet-backdrop" id="sheetBackdrop">
  <div class="sheet" id="sheet">
    <div class="handle"></div>
    <div class="sheet-title" id="sheetTitle">รหัสรุ่น</div>
    <div class="sheet-sub" id="sheetSub">เบอร์ 28</div>
    <div class="stepper">
      <button type="button" id="minusBtn">−</button>
      <input type="number" id="sheetInput" inputmode="numeric" pattern="[0-9]*" value="0" readonly>
      <button type="button" id="plusBtn">+</button>
    </div>
    <div class="sheet-actions">
      <button type="button" class="btn-clear" id="clearBtn">ล้างเป็น 0</button>
      <button type="button" class="btn-save" id="saveBtn">เสร็จสิ้น</button>
    </div>
  </div>
</div>

<footer>ทำโดย Claude · ข้อมูลเก็บไว้ในเบราว์เซอร์เครื่องนี้เท่านั้น</footer>

<script>
const codes = [
  "41A16B1","41A18B1","41A19B1","41C12B1","41C18B1","41C20B1",
  "41G94C1","41G97C1","41G99B1","41N08-C1","41N09C1","41N18B1","41N19C1",
  "CD-11","CD-22","CD-88","CD-99","CF-2564","CF-2566","CK-2",
  "PC-2218","PC-2219","PN-885","PN-995","SF-222","SM-4","SP-2","SP-6529","SP-6530"
];

// brand + pattern + color info per code (ไม่มีโลโก้บนกล่อง = Chappy)
const META = {
  "CF-2566":  { brand:"Chappy", pattern:"Frozen",                          color:"ขาว" },
  "SF-222":   { brand:"Chappy", pattern:"Sofia the First",                 color:"ขาว" },
  "CF-2564":  { brand:"Chappy", pattern:"Frozen",                          color:"ขาว" },
  "41G99B1":  { brand:"ADDA",   pattern:"Cinderella",                      color:"ขาว" },
  "PN-995":   { brand:"Chappy", pattern:"My Little Pony",                  color:"ขาว" },
  "PC-2219":  { brand:"Chappy", pattern:"Cinderella",                      color:"ขาว" },
  "41G97C1":  { brand:"ADDA",   pattern:"Tinker Bell",                     color:"ขาว" },
  "41G94C1":  { brand:"ADDA",   pattern:"My Little Pony",                  color:"ขาว" },
  "41C18B1":  { brand:"ADDA",   pattern:"Tinker Bell",                     color:"ดำ" },
  "41C12B1":  { brand:"ADDA",   pattern:"Tinker Bell / Fairies",           color:"ดำ" },
  "41A19B1":  { brand:"ADDA",   pattern:"Avengers (Iron Man)",             color:"ดำ" },
  "SP-6529":  { brand:"Chappy", pattern:"Spider-Man",                      color:"ดำ" },
  "CK-2":     { brand:"Chappy", pattern:"Demon Slayer",                    color:"ขาว" },
  "41N18B1":  { brand:"ADDA",   pattern:"Spider-Man: No Way Home",         color:"ขาว" },
  "SP-6530":  { brand:"Chappy", pattern:"Spider-Man",                      color:"ขาว" },
  "41N08-C1": { brand:"ADDA",   pattern:"Ben 10",                          color:"ขาว" },
  "CD-11":    { brand:"Chappy", pattern:"Demon Slayer",                    color:"ดำ" },
  "CD-88":    { brand:"Chappy", pattern:"Demon Slayer",                    color:"ดำ" },
  "41A18B1":  { brand:"ADDA",   pattern:"Spider-Man: No Way Home",         color:"ดำ" },
  "PC-2218":  { brand:"Chappy", pattern:"Cinderella",                      color:"ดำ" },
  "CD-22":    { brand:"Chappy", pattern:"Demon Slayer",                    color:"ขาว" },
  "CD-99":    { brand:"Chappy", pattern:"Demon Slayer",                    color:"ขาว" },
  "SP-2":     { brand:"Chappy", pattern:"Spider-Man",                      color:"ขาว" },
  "SM-4":     { brand:"Chappy", pattern:"Amazing Spider-Man",              color:"ขาว" },
  "41N09C1":  { brand:"ADDA",   pattern:"Pokemon",                         color:"ขาว" },
  "41N19C1":  { brand:"ADDA",   pattern:"Avengers (Iron Man)",             color:"ขาว" },
  "41A16B1":  { brand:"ADDA",   pattern:"Spidey and His Amazing Friends",  color:"ดำ" },
  "41C20B1":  { brand:"ADDA",   pattern:"Cinderella",                      color:"ดำ" },
  "PN-885":   { brand:"Chappy", pattern:"My Little Pony",                  color:"ดำ" }
};

// fixed size range every model can have
const SIZES = [];
for(let s=25; s<=35; s++) SIZES.push(s);

const STORAGE_KEY = "shoeStockData_v3";

function loadData(){
  try{
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
  }catch(e){ return {}; }
}
function saveData(data){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

let data = loadData();
codes.forEach(c=>{
  if(!data[c] || typeof data[c] !== 'object' || !data[c].sizes){
    data[c] = { sizes: {} };
  }
  SIZES.forEach(sz=>{
    if(data[c].sizes[sz] === undefined) data[c].sizes[sz] = 0;
  });
});
saveData(data);

const grid = document.getElementById('grid');
const searchBox = document.getElementById('searchBox');
const summary = document.getElementById('summary');

function updateSummary(){
  let totalStock = 0;
  codes.forEach(c=>{
    SIZES.forEach(sz=> totalStock += (parseInt(data[c].sizes[sz])||0));
  });
  summary.textContent = `รวม ${codes.length} รุ่น · สต็อครวม ${totalStock} คู่`;
}

// ---- bottom sheet logic ----
const sheetBackdrop = document.getElementById('sheetBackdrop');
const sheetTitle = document.getElementById('sheetTitle');
const sheetSub = document.getElementById('sheetSub');
const sheetInput = document.getElementById('sheetInput');
let activeCode = null, activeSize = null, activePill = null;
let savedScrollY = 0;

function lockScroll(){
  savedScrollY = window.scrollY || document.documentElement.scrollTop || 0;
  document.body.style.position = 'fixed';
  document.body.style.top = (-savedScrollY) + 'px';
  document.body.style.left = '0';
  document.body.style.right = '0';
  document.body.style.width = '100%';
}
function unlockScroll(){
  document.body.style.position = '';
  document.body.style.top = '';
  document.body.style.left = '';
  document.body.style.right = '';
  document.body.style.width = '';
  window.scrollTo(0, savedScrollY);
}

function openSheet(code, size, pillEl){
  activeCode = code; activeSize = size; activePill = pillEl;
  sheetTitle.textContent = code;
  sheetSub.textContent = 'เบอร์ ' + size;
  sheetInput.value = data[code].sizes[size] || 0;
  lockScroll();
  sheetBackdrop.classList.add('open');
}
function closeSheet(){
  sheetBackdrop.classList.remove('open');
  unlockScroll();
  activeCode = null; activeSize = null; activePill = null;
}
function commitSheet(){
  if(activeCode === null) return;
  const v = Math.max(0, parseInt(sheetInput.value)||0);
  data[activeCode].sizes[activeSize] = v;
  saveData(data);
  if(activePill) activePill.classList.toggle('has-stock', v > 0);
  updateSummary();
}

document.getElementById('minusBtn').onclick = ()=>{
  sheetInput.value = Math.max(0, (parseInt(sheetInput.value)||0) - 1);
};
document.getElementById('plusBtn').onclick = ()=>{
  sheetInput.value = (parseInt(sheetInput.value)||0) + 1;
};
document.getElementById('clearBtn').onclick = ()=>{
  sheetInput.value = 0;
};
document.getElementById('saveBtn').onclick = ()=>{
  commitSheet();
  closeSheet();
};
sheetBackdrop.addEventListener('click', (e)=>{
  if(e.target === sheetBackdrop){
    commitSheet();
    closeSheet();
  }
});

function render(filter=""){
  grid.innerHTML = "";
  const f = filter.trim().toLowerCase();
  codes.forEach(code=>{
    if(f && !code.toLowerCase().includes(f)) return;

    const card = document.createElement('div');
    card.className = 'card';

    const img = document.createElement('img');
    img.src = code + ".JPG";
    img.alt = code;
    img.loading = "lazy";
    img.onerror = function(){ this.style.background="#f2e3ea"; };
    img.onclick = ()=>{
      document.getElementById('lightboxImg').src = img.src;
      document.getElementById('lightbox').classList.add('open');
    };
    card.appendChild(img);

    const body = document.createElement('div');
    body.className = 'body';

    const codeEl = document.createElement('div');
    codeEl.className = 'code';
    codeEl.textContent = code;
    body.appendChild(codeEl);

    const m = META[code];
    if(m){
      const metaEl = document.createElement('div');
      metaEl.className = 'meta';
      metaEl.innerHTML = `<span class="brand">${m.brand}</span> · ${m.pattern}`;
      body.appendChild(metaEl);
    }

    const pillRow = document.createElement('div');
    pillRow.className = 'size-pills';

    SIZES.forEach(sz=>{
      const pill = document.createElement('button');
      pill.type = 'button';
      pill.className = 'pill';
      pill.textContent = sz;
      if((parseInt(data[code].sizes[sz])||0) > 0) pill.classList.add('has-stock');
      pill.onclick = ()=> openSheet(code, sz, pill);
      pillRow.appendChild(pill);
    });

    body.appendChild(pillRow);
    card.appendChild(body);
    grid.appendChild(card);
  });
  updateSummary();
}

searchBox.oninput = ()=> render(searchBox.value);

function pad2(n){ return String(n).padStart(2,'0'); }
function fmtDate(d){ return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
function csvEscape(v){
  if(v === null || v === undefined) v = '';
  v = String(v);
  if(/[",\n]/.test(v)) v = '"' + v.replace(/"/g,'""') + '"';
  return v;
}

const SHOPEE_HEADERS = [
  "หมวดหมู่สินค้า","ชื่อสินค้า","รายละเอียดสินค้า",
  "จำนวนสินค้าสูงสุดที่ซื้อได้","จำนวนสินค้าสูงสุดที่ซื้อได้ - เวลาเริ่มต้น",
  "จำนวนสินค้าสูงสุดที่ซื้อได้ - ระยะเวลา (วัน)","จำนวนสินค้าสูงสุดที่ซื้อได้ - วันที่สิ้นสุด",
  "จำนวนการซื้อขั้นต่ำ","Parent SKU","เลขอ้างอิงตัวเลือกสินค้า",
  "ชื่อตัวเลือก 1","ตัวเลือก 1","ภาพตัวเลือก","ชื่อตัวเลือก 2","ตัวเลือก 2",
  "ราคา","คลังสินค้า","เลข SKU","แบบฟอร์มตารางขนาดสินค้า","รูปภาพตารางขนาดสินค้า",
  "GTIN","ภาพปก","รูปภาพ 1","รูปภาพ 2","รูปภาพ 3","รูปภาพ 4","รูปภาพ 5",
  "รูปภาพ 6","รูปภาพ 7","รูปภาพ 8","น้ำหนัก","ความยาว","ความกว้าง","ความสูง",
  "Standard Delivery - ส่งธรรมดาในประเทศ","ระยะเวลาเตรียมพัสดุสำหรับสินค้าพรีออเดอร์","เหตุผล"
];

document.getElementById('exportBtn').onclick = ()=>{
  const today = new Date();
  const start = new Date(today); start.setDate(start.getDate()+1);
  const end = new Date(start); end.setDate(end.getDate()+365);
  const startStr = fmtDate(start), endStr = fmtDate(end);

  const rows = [SHOPEE_HEADERS];

  codes.forEach(code=>{
    const m = META[code];
    if(!m) return;
    const sizesWithStock = SIZES.filter(sz => (parseInt(data[code].sizes[sz])||0) > 0);
    if(sizesWithStock.length === 0) return;

    const colorRef = m.color === 'ดำ' ? 'BK-01' : 'WH-01';
    const productName = `รองเท้านักเรียนเด็ก ${m.brand} ${code} ${m.pattern} ${m.color} เบอร์ 25-35`;

    sizesWithStock.forEach((sz)=>{
      const stock = data[code].sizes[sz];
      rows.push([
        "",                              // หมวดหมู่สินค้า (เว้นว่างเสมอ)
        productName,                     // ชื่อสินค้า
        productName,                     // รายละเอียดสินค้า
        10,                              // จำนวนสินค้าสูงสุดที่ซื้อได้
        startStr,                        // เวลาเริ่มต้น
        365,                             // ระยะเวลา (วัน)
        endStr,                          // วันที่สิ้นสุด
        1,                               // จำนวนการซื้อขั้นต่ำ
        code,                            // Parent SKU
        colorRef,                        // เลขอ้างอิงตัวเลือกสินค้า
        "สี",                            // ชื่อตัวเลือก 1
        m.color,                         // ตัวเลือก 1
        "",                              // ภาพตัวเลือก
        "ไซส์",                          // ชื่อตัวเลือก 2
        String(sz),                      // ตัวเลือก 2
        180,                             // ราคา
        stock,                           // คลังสินค้า
        "",                              // เลข SKU
        "", "",                          // แบบฟอร์มตารางขนาดสินค้า, รูปภาพตารางขนาดสินค้า
        "",                              // GTIN
        "",                              // ภาพปก
        "", "", "", "", "", "", "", "",  // รูปภาพ 1-8
        1,                               // น้ำหนัก
        20,                              // ความยาว
        15,                              // ความกว้าง
        15,                              // ความสูง
        "เปิด",                          // Standard Delivery
        "",                              // ระยะเวลาเตรียมพัสดุ
        ""                               // เหตุผล
      ]);
    });
  });

  const csvContent = rows.map(r => r.map(csvEscape).join(',')).join('\n');
  const blob = new Blob(["﻿"+csvContent], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = "shopee_mass_upload.csv";
  a.click();
  URL.revokeObjectURL(url);
};

document.getElementById('resetBtn').onclick = ()=>{
  if(confirm("ล้างข้อมูลสต็อคทั้งหมดใช่หรือไม่?")){
    codes.forEach(c=>{
      data[c] = { sizes: {} };
      SIZES.forEach(sz=> data[c].sizes[sz] = 0);
    });
    saveData(data);
    render(searchBox.value);
  }
};

document.getElementById('lightbox').onclick = function(){
  this.classList.remove('open');
};

render();
</script>
