<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>รายการสต็อครองเท้า</title>
<style>
  :root{
    --pink:#ff6fa5;
    --pink-dark:#e6528c;
    --bg:#fff6f9;
    --card:#ffffff;
    --border:#f0d9e4;
    --text:#3a2a32;
    --muted:#9b8790;
    --green:#3fae5c;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{ touch-action:manipulation; }
  body{
    margin:0;
    font-family:'Segoe UI', Tahoma, sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-text-size-adjust:100%;
    overscroll-behavior-y:contain;
  }
  header{
    background:linear-gradient(135deg,#ff8fb8,#ff6fa5);
    color:#fff;
    padding:16px 14px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
    position:sticky;
    top:0;
    z-index:10;
  }
  header h1{margin:0 0 4px;font-size:1.2rem;}
  header p{margin:0;font-size:0.78rem;opacity:0.9;}
  .toolbar{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    justify-content:center;
    padding:10px 12px;
    background:#fff;
    border-bottom:1px solid var(--border);
    position:sticky;
    top:70px;
    z-index:9;
  }
  .toolbar input[type="text"]{
    padding:9px 12px;
    border-radius:20px;
    border:1px solid var(--border);
    width:180px;
    max-width:55vw;
    font-size:16px;
  }
  .toolbar button{
    padding:9px 14px;
    border-radius:20px;
    border:none;
    background:var(--pink);
    color:#fff;
    font-size:0.8rem;
    cursor:pointer;
  }
  .toolbar button.secondary{
    background:#fff;
    color:var(--pink-dark);
    border:1px solid var(--pink);
  }
  .summary-bar{
    text-align:center;
    font-size:0.78rem;
    color:var(--muted);
    padding:6px 0 2px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));
    gap:12px;
    padding:12px;
    max-width:1400px;
    margin:0 auto;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 2px 6px rgba(0,0,0,0.05);
    display:flex;
    flex-direction:column;
  }
  .card img{
    width:100%;
    height:130px;
    object-fit:cover;
    background:#eee;
  }
  .card .body{
    padding:8px 8px 10px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .code{
    font-weight:700;
    font-size:0.85rem;
    color:var(--pink-dark);
    text-align:center;
  }
  .size-pills{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    justify-content:center;
  }
  .pill{
    position:relative;
    width:30px;
    height:30px;
    border-radius:50%;
    border:1px solid var(--border);
    background:#fff;
    color:var(--text);
    font-size:0.75rem;
    cursor:pointer;
    padding:0;
  }
  .pill.has-stock{
    border-color:var(--green);
    background:#eafbee;
    color:#2c8a45;
    font-weight:700;
  }
  .pill.has-stock::after{
    content:"";
    position:absolute;
    top:-2px;
    right:-2px;
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--green);
    border:1.5px solid #fff;
  }

  /* bottom sheet */
  .sheet-backdrop{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.45);
    z-index:200;
  }
  .sheet-backdrop.open{ display:block; }
  .sheet{
    position:fixed;
    left:0; right:0; bottom:0;
    background:#fff;
    border-radius:20px 20px 0 0;
    padding:18px 20px calc(20px + env(safe-area-inset-bottom));
    z-index:201;
    transform:translateY(100%);
    transition:transform 0.25s ease;
    box-shadow:0 -4px 20px rgba(0,0,0,0.15);
  }
  .sheet-backdrop.open .sheet{ transform:translateY(0); }
  .sheet .handle{
    width:40px;
    height:4px;
    border-radius:2px;
    background:var(--border);
    margin:0 auto 14px;
  }
  .sheet .sheet-title{
    text-align:center;
    font-size:1.1rem;
    font-weight:700;
    color:var(--pink-dark);
    margin-bottom:2px;
  }
  .sheet .sheet-sub{
    text-align:center;
    font-size:0.8rem;
    color:var(--muted);
    margin-bottom:16px;
  }
  .sheet .stepper{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
    margin-bottom:20px;
  }
  .sheet .stepper button{
    width:52px;
    height:52px;
    border-radius:50%;
    border:none;
    background:#fdeaf1;
    color:var(--pink-dark);
    font-size:1.6rem;
    line-height:1;
    cursor:pointer;
  }
  .sheet .stepper button:active{ background:var(--pink); color:#fff; }
  .sheet .stepper input{
    width:90px;
    text-align:center;
    padding:10px 4px;
    border-radius:12px;
    border:1px solid var(--border);
    font-size:20px;
    font-weight:700;
  }
  .sheet .sheet-actions{
    display:flex;
    gap:10px;
  }
  .sheet .sheet-actions button{
    flex:1;
    padding:14px;
    border-radius:14px;
    border:none;
    font-size:1rem;
    font-weight:600;
    cursor:pointer;
  }
  .sheet .btn-save{
    background:var(--pink);
    color:#fff;
  }
  .sheet .btn-clear{
    background:#f4eef1;
    color:var(--muted);
  }

  footer{
    text-align:center;
    padding:20px;
    color:var(--muted);
    font-size:0.75rem;
  }
  .lightbox{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.8);
    align-items:center;
    justify-content:center;
    z-index:100;
    cursor:zoom-out;
  }
  .lightbox img{
    max-width:90vw;
    max-height:90vh;
    border-radius:8px;
  }
  .lightbox.open{display:flex;}
</style>
</head>
<body>

<header>
  <h1>รายการสต็อครองเท้า</h1>
  <p>แตะเบอร์ที่ต้องการเพื่อใส่จำนวนสต็อค</p>
</header>

<div class="toolbar">
  <input type="text" id="searchBox" placeholder="ค้นหารหัสรุ่น...">
  <button id="exportBtn">CSV</button>
  <button class="secondary" id="resetBtn">ล้างข้อมูล</button>
</div>
<div class="summary-bar" id="summary"></div>

<div class="grid" id="grid"></div>

<div class="lightbox" id="lightbox"><img id="lightboxImg" src=""></div>

<div class="sheet-backdrop" id="sheetBackdrop">
  <div class="sheet" id="sheet">
    <div class="handle"></div>
    <div class="sheet-title" id="sheetTitle">รหัสรุ่น</div>
    <div class="sheet-sub" id="sheetSub">เบอร์ 28</div>
    <div class="stepper">
      <button type="button" id="minusBtn">−</button>
      <input type="number" id="sheetInput" inputmode="numeric" pattern="[0-9]*" value="0">
      <button type="button" id="plusBtn">+</button>
    </div>
    <div class="sheet-actions">
      <button type="button" class="btn-clear" id="clearBtn">ล้างเป็น 0</button>
      <button type="button" class="btn-save" id="saveBtn">เสร็จสิ้น</button>
    </div>
  </div>
</div>

<footer>ทำโดย Claude · ข้อมูลเก็บไว้ในเบราว์เซอร์เครื่องนี้เท่านั้น</footer>

<script>
const codes = [
  "41A16B1","41A18B1","41A19B1","41C12B1","41C18B1","41C20B1",
  "41G94C1","41G97C1","41G99B1","41N08-C1","41N09C1","41N18B1","41N19C1",
  "CD-11","CD-22","CD-88","CD-99","CF-2564","CF-2566","CK-2",
  "PC-2218","PC-2219","PN-885","PN-995","SF-222","SM-4","SP-2","SP-6529","SP-6530"
];

// fixed size range every model can have
const SIZES = [];
for(let s=25; s<=35; s++) SIZES.push(s);

const STORAGE_KEY = "shoeStockData_v3";

function loadData(){
  try{
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
  }catch(e){ return {}; }
}
function saveData(data){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

let data = loadData();
codes.forEach(c=>{
  if(!data[c] || typeof data[c] !== 'object' || !data[c].sizes){
    data[c] = { sizes: {} };
  }
  SIZES.forEach(sz=>{
    if(data[c].sizes[sz] === undefined) data[c].sizes[sz] = 0;
  });
});
saveData(data);

const grid = document.getElementById('grid');
const searchBox = document.getElementById('searchBox');
const summary = document.getElementById('summary');

function updateSummary(){
  let totalStock = 0;
  codes.forEach(c=>{
    SIZES.forEach(sz=> totalStock += (parseInt(data[c].sizes[sz])||0));
  });
  summary.textContent = `รวม ${codes.length} รุ่น · สต็อครวม ${totalStock} คู่`;
}

// ---- bottom sheet logic ----
const sheetBackdrop = document.getElementById('sheetBackdrop');
const sheetTitle = document.getElementById('sheetTitle');
const sheetSub = document.getElementById('sheetSub');
const sheetInput = document.getElementById('sheetInput');
let activeCode = null, activeSize = null, activePill = null;

function openSheet(code, size, pillEl){
  activeCode = code; activeSize = size; activePill = pillEl;
  sheetTitle.textContent = code;
  sheetSub.textContent = 'เบอร์ ' + size;
  sheetInput.value = data[code].sizes[size] || 0;
  sheetBackdrop.classList.add('open');
}
function closeSheet(){
  sheetBackdrop.classList.remove('open');
  activeCode = null; activeSize = null; activePill = null;
}
function commitSheet(){
  if(activeCode === null) return;
  const v = Math.max(0, parseInt(sheetInput.value)||0);
  data[activeCode].sizes[activeSize] = v;
  saveData(data);
  if(activePill) activePill.classList.toggle('has-stock', v > 0);
  updateSummary();
}

document.getElementById('minusBtn').onclick = ()=>{
  sheetInput.value = Math.max(0, (parseInt(sheetInput.value)||0) - 1);
};
document.getElementById('plusBtn').onclick = ()=>{
  sheetInput.value = (parseInt(sheetInput.value)||0) + 1;
};
document.getElementById('clearBtn').onclick = ()=>{
  sheetInput.value = 0;
};
document.getElementById('saveBtn').onclick = ()=>{
  commitSheet();
  closeSheet();
};
sheetBackdrop.addEventListener('click', (e)=>{
  if(e.target === sheetBackdrop){
    commitSheet();
    closeSheet();
  }
});

function render(filter=""){
  grid.innerHTML = "";
  const f = filter.trim().toLowerCase();
  codes.forEach(code=>{
    if(f && !code.toLowerCase().includes(f)) return;

    const card = document.createElement('div');
    card.className = 'card';

    const img = document.createElement('img');
    img.src = code + ".JPG";
    img.alt = code;
    img.loading = "lazy";
    img.onerror = function(){ this.style.background="#f2e3ea"; };
    img.onclick = ()=>{
      document.getElementById('lightboxImg').src = img.src;
      document.getElementById('lightbox').classList.add('open');
    };
    card.appendChild(img);

    const body = document.createElement('div');
    body.className = 'body';

    const codeEl = document.createElement('div');
    codeEl.className = 'code';
    codeEl.textContent = code;
    body.appendChild(codeEl);

    const pillRow = document.createElement('div');
    pillRow.className = 'size-pills';

    SIZES.forEach(sz=>{
      const pill = document.createElement('button');
      pill.type = 'button';
      pill.className = 'pill';
      pill.textContent = sz;
      if((parseInt(data[code].sizes[sz])||0) > 0) pill.classList.add('has-stock');
      pill.onclick = ()=> openSheet(code, sz, pill);
      pillRow.appendChild(pill);
    });

    body.appendChild(pillRow);
    card.appendChild(body);
    grid.appendChild(card);
  });
  updateSummary();
}

searchBox.oninput = ()=> render(searchBox.value);

document.getElementById('exportBtn').onclick = ()=>{
  let csv = "รหัสรุ่น,เบอร์,จำนวนสต็อค\n";
  codes.forEach(c=>{
    SIZES.forEach(sz=>{
      const v = parseInt(data[c].sizes[sz])||0;
      if(v > 0) csv += `${c},${sz},${v}\n`;
    });
  });
  const blob = new Blob(["﻿"+csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = "สต็อครองเท้า.csv";
  a.click();
  URL.revokeObjectURL(url);
};

document.getElementById('resetBtn').onclick = ()=>{
  if(confirm("ล้างข้อมูลสต็อคทั้งหมดใช่หรือไม่?")){
    codes.forEach(c=>{
      data[c] = { sizes: {} };
      SIZES.forEach(sz=> data[c].sizes[sz] = 0);
    });
    saveData(data);
    render(searchBox.value);
  }
};

document.getElementById('lightbox').onclick = function(){
  this.classList.remove('open');
};

render();
</script>
</body>
</html>
